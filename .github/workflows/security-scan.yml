name: security-scan

# Runs on every push / PR:
#   - Trivy filesystem scan: vulnerabilities (CVE), misconfigurations (IaC),
#     secrets, licenses  (the four screening-scorecard categories)
#   - Semgrep SAST (registry rulesets + local rules)
#   - npm audit (production dependency CVEs)
# Fails the build on any HIGH/CRITICAL.
on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy (vuln / misconfig / secret / license)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Install the Trivy binary via the official script (version-independent,
      # avoids broken action version pins).
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin
          trivy --version
      - name: Trivy table (all severities)
        run: trivy fs --scanners vuln,misconfig,secret,license --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --format table .
      - name: Trivy JSON report
        run: trivy fs --scanners vuln,misconfig,secret,license --format json --output trivy-report.json .
      - name: Trivy gate (HIGH,CRITICAL)
        run: trivy fs --scanners vuln,misconfig,secret,license --severity HIGH,CRITICAL --exit-code 1 .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.json

  sast:
    name: Semgrep / OpenGrep + npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Semgrep
        run: |
          python3 -m pip install --quiet semgrep
          semgrep scan --config p/javascript --config p/typescript --config p/nodejs \
            --config security/semgrep-rules.yml --error --json --output semgrep-report.json .
      # OpenGrep with the same config the screening scorecard uses.
      - name: OpenGrep (r/all)
        continue-on-error: true
        run: |
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh | bash
          export PATH="$HOME/.opengrep/cli/latest:$PATH"
          opengrep --version
          opengrep --config=r/all --exclude-rule=bbp-pattern-inject --json --verbose . > opengrep-results.json || true
      - name: npm audit (production)
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-reports
          path: |
            semgrep-report.json
            opengrep-results.json
