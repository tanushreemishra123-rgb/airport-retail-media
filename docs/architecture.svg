<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5b6470"/></marker>
    <style>.t{font-size:13px;font-weight:600;fill:#13203a}.s{font-size:11px;fill:#55617a}.lbl{font-size:10px;fill:#6b7688}</style>
  </defs>
  <rect width="980" height="640" fill="#f5f7fb"/>
  <text x="490" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#101a30">SkyReach — Airport Retail Media (single service)</text>
  <text x="490" y="49" text-anchor="middle" class="s">The model ranks; a deterministic verification gate decides. Adapters isolate every feed from the core.</text>

  <!-- feeds -->
  <rect x="30" y="80" width="190" height="150" rx="10" fill="#eef3ff" stroke="#9db6ff"/>
  <text x="125" y="102" text-anchor="middle" class="t">External feeds</text>
  <rect x="48" y="116" width="154" height="30" rx="6" fill="#fff" stroke="#c9d6f5"/><text x="125" y="135" text-anchor="middle" class="s">AODB — 33-col CSV</text>
  <rect x="48" y="152" width="154" height="30" rx="6" fill="#fff" stroke="#c9d6f5"/><text x="125" y="171" text-anchor="middle" class="s">AIDX — FlightLeg XML</text>
  <rect x="48" y="188" width="154" height="30" rx="6" fill="#fff" stroke="#c9d6f5"/><text x="125" y="207" text-anchor="middle" class="s">ACRIS — NGSI-LD JSON</text>

  <!-- adapters -->
  <rect x="265" y="100" width="160" height="110" rx="10" fill="#fff5e6" stroke="#f0c070"/>
  <text x="345" y="122" text-anchor="middle" class="t">Adapters</text>
  <text x="345" y="144" text-anchor="middle" class="s">translate → canonical</text>
  <text x="345" y="164" text-anchor="middle" class="s">one env var to go live</text>
  <text x="345" y="188" text-anchor="middle" class="lbl">FlightSource · QueueSource</text>

  <!-- core engine -->
  <rect x="470" y="70" width="300" height="200" rx="12" fill="#eafff2" stroke="#53c98a"/>
  <text x="620" y="92" text-anchor="middle" class="t">@arm/core + sim engine</text>
  <text x="620" y="113" text-anchor="middle" class="s">presence rollup (gate proximity × time)</text>
  <rect x="486" y="126" width="268" height="124" rx="8" fill="#fff" stroke="#bfe8d0"/>
  <text x="620" y="146" text-anchor="middle" class="s">profile → filter → score →</text>
  <text x="620" y="164" text-anchor="middle" class="s">business rules → choose (AI pick)</text>
  <text x="620" y="186" text-anchor="middle" class="t">→ VERIFY (evidence exists, fresh,</text>
  <text x="620" y="203" text-anchor="middle" class="t">hard rules, score reproducible)</text>
  <text x="620" y="226" text-anchor="middle" class="s">pass → play · fail → rule fallback</text>
  <text x="620" y="243" text-anchor="middle" class="lbl">every decision logged with evidence</text>

  <!-- clock -->
  <rect x="470" y="290" width="140" height="70" rx="10" fill="#f3eefc" stroke="#b79af0"/>
  <text x="540" y="312" text-anchor="middle" class="t">Sim clock</text>
  <text x="540" y="331" text-anchor="middle" class="s">play · 1/10/60×</text>
  <text x="540" y="348" text-anchor="middle" class="s">jump · inject</text>

  <!-- db -->
  <rect x="630" y="290" width="140" height="70" rx="10" fill="#eef3ff" stroke="#9db6ff"/>
  <text x="700" y="312" text-anchor="middle" class="t">SQLite (Drizzle)</text>
  <text x="700" y="331" text-anchor="middle" class="s">seed on boot</text>
  <text x="700" y="348" text-anchor="middle" class="s">+ redemptions</text>

  <!-- server wrapper -->
  <rect x="250" y="400" width="540" height="70" rx="10" fill="#eef2f7" stroke="#8aa0bf"/>
  <text x="520" y="424" text-anchor="middle" class="t">Fastify — REST /api + WebSocket /ws + static SPA (one port)</text>
  <text x="520" y="446" text-anchor="middle" class="s">one container → one public URL, preconfigured &amp; seeded</text>

  <!-- clients -->
  <rect x="120" y="510" width="760" height="100" rx="12" fill="#ffffff" stroke="#c9d3e6"/>
  <text x="500" y="532" text-anchor="middle" class="t">React SPA — role switcher</text>
  <g>
    <rect x="140" y="548" width="120" height="44" rx="8" fill="#0b0f17"/><text x="200" y="574" text-anchor="middle" font-size="11" fill="#e8eef9">Platform Admin</text>
    <rect x="270" y="548" width="110" height="44" rx="8" fill="#f7f9fe" stroke="#dde5f2"/><text x="325" y="574" text-anchor="middle" font-size="11" fill="#16203a">Retailer</text>
    <rect x="390" y="548" width="120" height="44" rx="8" fill="#f7f9fe" stroke="#dde5f2"/><text x="450" y="574" text-anchor="middle" font-size="11" fill="#16203a">Media Manager</text>
    <rect x="520" y="548" width="110" height="44" rx="8" fill="#f7f9fe" stroke="#dde5f2"/><text x="575" y="574" text-anchor="middle" font-size="11" fill="#16203a">Airline Rep</text>
    <rect x="640" y="548" width="110" height="44" rx="8" fill="#000"/><text x="695" y="574" text-anchor="middle" font-size="11" fill="#fff">Passenger</text>
    <rect x="760" y="548" width="100" height="44" rx="8" fill="#f7f9fe" stroke="#dde5f2"/><text x="810" y="574" text-anchor="middle" font-size="11" fill="#16203a">Mobile claim</text>
  </g>

  <!-- arrows -->
  <line x1="220" y1="155" x2="263" y2="155" stroke="#5b6470" marker-end="url(#a)"/>
  <line x1="425" y1="155" x2="468" y2="150" stroke="#5b6470" marker-end="url(#a)"/>
  <line x1="540" y1="270" x2="560" y2="290" stroke="#5b6470" marker-end="url(#a)"/>
  <line x1="700" y1="270" x2="700" y2="290" stroke="#5b6470" marker-end="url(#a)"/>
  <line x1="520" y1="360" x2="520" y2="400" stroke="#5b6470" marker-end="url(#a)"/>
  <line x1="500" y1="470" x2="500" y2="510" stroke="#5b6470" marker-end="url(#a)"/>
  <text x="520" y="492" text-anchor="middle" class="lbl">REST + WebSocket deltas (&lt; 2s)</text>
</svg>
